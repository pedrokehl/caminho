name: Test

on: [pull_request]

jobs:
  test:
    name: 🧪 Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm install
      - run: npm test
