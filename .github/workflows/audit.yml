name: Audit

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  build:
    name: 🔍 Audit
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
      - run: npm audit
