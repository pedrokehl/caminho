name: Build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: 🛠 Build
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
      - run: npm install
      - run: npm run build
      - name: Check package.json and jsr.json versions match
        run: >
          node -e "const p=require('./package.json').version,j=require('./jsr.json').version;
          if(p!==j){console.error('Version mismatch: package.json '+p+' vs jsr.json '+j);process.exit(1)}"
